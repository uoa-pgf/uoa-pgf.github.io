  id: 3
  name: "Dr. Alberto Carrasco-Casado"
  company: "National Institute of Information and Communications Technology (NICT)"
  bio: "Alberto Carrasco-Casado received the B.S. degree in telecommunication engineering from Málaga University, Málaga, Spain, in 2005, and the M.S. degree in telecommunication engineering and second M.S. degree in space research from the University of Alcalá, Madrid, Spain, in 2008 and 2009, respectively, and the Ph.D. degree in electric, electronic, and automation engineering from the Carlos III University of Madrid, Getafe, Spain, and Spanish National Research Council, Madrid, in 2015. In 2015, he joined the Space Communication Systems Laboratory, National Institute of Information and Communications Technology, Tokyo, Japan. His research interests include free-space optics, satellite communications, space engineering, and quantum cryptography."
