  id: 3
  name: "Dr. Alberto Carrasco-Casado"
  company: "National Institute of Information and Communications Technology (NICT)"
  bio: " Alberto Carrasco-Casado is a Telecommunications Engineer from Spain, currently living in Tokyo, Japan, since 2015. He holds a PhD in Electrical, Electronic and Automatic Engineering, as well as three Master's Degrees in Telecommunications, Space Science and Technology, and Advanced Electronic Systems. Alberto has received various awards for his work related to space laser communications, including the successful completion of satellite missions. In his 20-year career, he has conducted research at various top-class universities and national research institutes on topics such as quantum key distribution and optical wireless communications. After spending the last 10 years at the Japanese National Institute of ICT, he currently holds a permanent position as a senior researcher, leading a research line focused on developing novel space laser-communication terminals, including an ongoing satellite mission scheduled for launch in 2026."
