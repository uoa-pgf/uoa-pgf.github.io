  id: 2
  name: "Prof. Kohei Shiomoto"
  company: "Tokyo City University"
  title: "IEICE Fellow"
  bio: "Kohei Shiomoto is a Professor at Tokyo City University, Tokyo, Japan. He has been engaged in research and development in the data communication industry since joining NTT Laboratories in 1989, and has been active in research and education in data science and industrial systems since joining Tokyo City University in 2017. He received his B.E., M.E., and Ph.D. degrees in Information and Computer Sciences from Osaka University, Osaka, Japan, in 1987, 1989, and 1998, respectively. He is a Fellow of the Institute of Electronics, Information and Communication Engineers (IEICE), a Senior Member of the IEEE, and a member of the Association for Computing Machinery (ACM) and the Information Processing Society of Japan (IPSJ)."
