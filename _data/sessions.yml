  id: 001
  title: "Transitioning from R&D to an Academic Career - Lessons on Growth, Curiosity, and Connection through Networks and AI Research"
  description: "This talk shares my journey from industrial research at NTT Laboratories to academic research at Tokyo City University, where I now lead the DREAM Project — Decentralized, Reliable, Efficient, AI-based Management.
During nearly three decades at NTT, I gained valuable experience in research management and leadership, witnessing remarkable technological innovations — from telephony to the Internet, mobile communications, cloud computing, and AI. Working at one of the most influential technology companies also allowed me to collaborate with universities and industry partners around the world.
These experiences became a strong foundation for my academic life, where I continue to enjoy wide-ranging collaborations and intellectual freedom. The transition itself, however, was like taking off a heavy suit of armor — a vulnerable yet essential step for growth. Engaging actively in the academic community through conferences and publications is one of the most effective ways to mitigate such risks and to continue growing as a researcher.
I will reflect on how these experiences shaped the DREAM vision and share lessons for young researchers on curiosity, adaptability, and collaboration. Session Chair: Prof. Pham Tuan Anh. "
  subtype: keynote
  speakers: [2]
